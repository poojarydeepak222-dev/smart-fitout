<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Digital Business Leads | Smart Fitout</title><link rel="stylesheet" href="../admin.css"><style>
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filters select,.filters input{padding:12px;border:1px solid #ddd;border-radius:10px}.filters input{flex:1;min-width:180px}.lead{background:#fff;border:1px solid #ece6df;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #0000000a}.lead-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#f6f1eb;font-size:12px;font-weight:800;text-transform:capitalize}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.grid label{font-size:12px;font-weight:800;color:#666}.grid input,.grid select,.grid textarea{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border:1px solid #ddd;border-radius:9px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button,.actions a{padding:10px 12px;border:0;border-radius:10px;text-decoration:none;font-weight:800;cursor:pointer}.save{background:#f47b20;color:#fff}.quote{background:#f3e8ff;color:#6b21a8}.wa{background:#e8f7ed;color:#126b36}.call{background:#e8f0ff;color:#174ea6}@media(max-width:650px){main{width:94%}.grid{grid-template-columns:1fr}}</style></head><body><div class="sf-shell"><header><div><b><span>Smart</span> Fitout</b><small>Digital Business Leads</small></div><a class="menu-btn" href="dashboard.html">←</a></header><main><div class="dashboard"><p>SMART FITOUT ADMIN</p><h1>Digital Business Leads</h1><span>Track website package enquiries, follow-ups and quotations.</span></div><div class="filters"><select id="status"><option value="all">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="follow_up">Follow-up</option><option value="quotation">Quotation</option><option value="won">Won</option><option value="lost">Lost</option></select><input id="search" placeholder="Search customer, business or phone"><button onclick="load()" style="padding:12px 16px;border:0;border-radius:10px;background:#f47b20;color:#fff;font-weight:800">↻ Refresh</button></div><div id="error" style="color:#b00020;font-weight:700"></div><div id="list">Loading leads…</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="../admin.js"></script><script>let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=d=>d?new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'Not set';async function load(){const er=document.getElementById('error');er.textContent='';document.getElementById('list').textContent='Loading leads…';const {data,error}=await sb.from('leads').select('id,created_at,name,mobile,business,service,message,status,follow_up_at,notes').ilike('service','%Digital Business%').order('created_at',{ascending:false});if(error){er.textContent='Could not load digital leads: '+error.message;return}all=data||[];render()}function render(){const st=document.getElementById('status').value,q=document.getElementById('search').value.toLowerCase();const rows=all.filter(l=>(st==='all'||l.status===st)&&(`${l.name} ${l.business||''} ${l.mobile} ${l.service||''}`.toLowerCase().includes(q)));document.getElementById('list').innerHTML=rows.length?rows.map(l=>`<article class="lead"><div class="lead-head"><div><h3 style="margin:0">${esc(l.business||'Business not provided')}</h3><div style="margin-top:5px;color:#666">${esc(l.name)} · <a href="tel:${esc(l.mobile)}">${esc(l.mobile)}</a></div></div><span class="badge">${esc((l.status||'new').replaceAll('_',' '))}</span></div><p style="color:#666;line-height:1.7;margin-bottom:0"><b>Package:</b> ${esc(l.service||'Digital Business Starter')}<br><b>Created:</b> ${fmt(l.created_at)}${l.message?'<br><b>Details:</b> '+esc(l.message):''}</p><div class="grid"><label>Status<select id="status-${l.id}"><option value="new" ${l.status==='new'?'selected':''}>New</option><option value="contacted" ${l.status==='contacted'?'selected':''}>Contacted</option><option value="follow_up" ${l.status==='follow_up'?'selected':''}>Follow-up</option><option value="quotation" ${l.status==='quotation'?'selected':''}>Quotation</option><option value="won" ${l.status==='won'?'selected':''}>Won</option><option value="lost" ${l.status==='lost'?'selected':''}>Lost</option></select></label><label>Follow-up<input id="follow-${l.id}" type="datetime-local" value="${l.follow_up_at?new Date(l.follow_up_at).toISOString().slice(0,16):''}"></label><label style="grid-column:1/-1">Admin notes<textarea id="notes-${l.id}" rows="2" placeholder="Follow-up notes">${esc(l.notes||'')}</textarea></label></div><div class="actions"><button class="save" onclick="saveLead(${l.id})">💾 Save</button><a class="quote" href="quotation.html?lead=${l.id}">🧾 Quotation</a><a class="wa" target="_blank" href="https://wa.me/${encodeURIComponent(String(l.mobile).replace(/\D/g,''))}?text=${encodeURIComponent('Hello '+l.name+', this is Smart Fitout regarding your Digital Business Starter enquiry.')}" >💬 WhatsApp</a><a class="call" href="tel:${esc(l.mobile)}">📞 Call</a></div></article>`).join(''):'<p>No digital business leads found.</p>'}async function saveLead(id){const status=document.getElementById('status-'+id).value,follow=document.getElementById('follow-'+id).value||null,notes=document.getElementById('notes-'+id).value.trim()||null;const {error}=await sb.from('leads').update({status,follow_up_at:follow?new Date(follow).toISOString():null,notes}).eq('id',id);if(error){alert(error.message);return}await load()}document.getElementById('status').onchange=render;document.getElementById('search').oninput=render;requireAdmin().then(()=>load());</script></body></html>
