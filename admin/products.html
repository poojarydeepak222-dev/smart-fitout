<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products & Services | Smart Fitout</title><link rel="stylesheet" href="../admin.css"><style>main{max-width:850px;margin:auto;padding:14px}.card,.product{background:#fff;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #0001}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:9px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:11px 15px;border:0;border-radius:9px;background:#f47b20;color:#fff;font-weight:700}.product{display:flex;justify-content:space-between;gap:12px}.product small{color:#777}@media(max-width:600px){.grid{grid-template-columns:1fr}.product{display:block}.product button{margin-top:10px}}</style></head><body><header><b>Smart Fitout</b><small> Products & Services</small></header><main><nav><a href="dashboard.html">🏠 Dashboard</a> · <a href="quotation.html">🧾 Quotation</a> · <a href="invoice.html">📄 Invoice</a></nav><div class="card"><h2>Add Product / Service</h2><input id="name" placeholder="Product / service name"><textarea id="description" placeholder="Description"></textarea><div class="grid"><input id="unit" value="Nos" placeholder="Unit"><input id="rate" type="number" step="0.01" placeholder="Default rate"></div><div class="grid"><input id="gst" type="number" step="0.01" value="0" placeholder="GST %"><input id="category" placeholder="Category"></div><button onclick="addProduct()">+ Add</button></div><h2>Product & Service List</h2><div id="list">Loading...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);requireAdmin();async function load(){const {data,error}=await db.from('product_services').select('*').order('id',{ascending:false});if(error){list.innerHTML='<p>'+error.message+'</p>';return}list.innerHTML=data.length?data.map(p=>`<div class="product"><div><b>${esc(p.name)}</b><br><small>${esc(p.description||'')} · ${esc(p.unit)} · ₹${Number(p.rate).toFixed(2)} · GST ${p.gst_percent}%</small></div><button onclick="del(${p.id})">Delete</button></div>`).join(''):'<p>No products/services added.</p>'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function addProduct(){const name=$('name').value.trim();if(!name){alert('Enter product/service name');return}const {error}=await db.from('product_services').insert({name,description:$('description').value,unit:$('unit').value||'Nos',rate:Number($('rate').value)||0,gst_percent:Number($('gst').value)||0,category:$('category').value||null});if(error)alert(error.message);else{['name','description','rate','category'].forEach(x=>$(x).value='');$('unit').value='Nos';$('gst').value=0;load()}}async function del(id){if(!confirm('Delete this product/service?'))return;const {error}=await db.from('product_services').delete().eq('id',id);if(error)alert(error.message);else load()}load();</script></body></html>
