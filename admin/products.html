<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Products & Services | Smart Fitout</title><link rel="stylesheet" href="../admin.css?v=20260831-4"></head><body><header><div><b><span>Smart</span> Fitout</b><small>Products & Services</small></div><button class="menu-btn" onclick="toggleDrawer()">☰</button></header><aside id="drawer" class="drawer"><button onclick="closeDrawer()">×</button><div style="clear:both"></div><a href="dashboard.html">🏠 Dashboard</a><a href="quotation.html">🧾 Quotation</a><a href="invoice.html">📄 Invoice</a><a href="products.html">🛠️ Products & Services</a><a href="documents.html">📋 Recent Documents</a><a href="settings.html">⚙️ Settings</a><a href="javascript:logout()">🚪 Logout</a></aside><main><div class="card"><h2>Add Product / Service</h2><div class="grid"><label>Name<input id="name" placeholder="Product / service name"></label><label>Category<input id="category" placeholder="Category"></label></div><label>Description<textarea id="description" placeholder="Description"></textarea></label><div class="grid"><label>Unit<input id="unit" value="Nos" placeholder="Unit"></label><label>Default Rate<input id="rate" type="number" step="0.01" min="0" placeholder="Default rate"></label></div><label>GST %<input id="gst" type="number" step="0.01" min="0" value="0"></label><button class="primary" type="button" onclick="addProduct()">+ Add Product / Service</button></div><div class="card"><h2>Product & Service List</h2><div id="list">Loading...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260831-4"></script><script>requireAdmin();const db=sb;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const {data,error}=await db.from('product_services').select('*').order('id',{ascending:false});if(error){$('list').innerHTML='<p>'+esc(error.message)+'</p>';return}$('list').innerHTML=data.length?data.map(p=>`<div class="doc"><div><b>${esc(p.name)}</b><br><small>${esc(p.description||'')} · ${esc(p.unit||'Nos')} · ₹${Number(p.rate||0).toFixed(2)} · GST ${Number(p.gst_percent||0)}%</small></div><button class="secondary" type="button" onclick="del(${p.id})">Delete</button></div>`).join(''):'<small>No products/services added.</small>'}async function addProduct(){const name=$('name').value.trim();if(!name){alert('Enter product/service name');return}const {error}=await db.from('product_services').insert({name,description:$('description').value.trim(),unit:$('unit').value.trim()||'Nos',rate:Number($('rate').value)||0,gst_percent:Number($('gst').value)||0,category:$('category').value.trim()||null});if(error){alert(error.message);return}['name','description','rate','category'].forEach(id=>$(id).value='');$('unit').value='Nos';$('gst').value=0;load()}async function del(id){if(!confirm('Delete this product/service?'))return;const {error}=await db.from('product_services').delete().eq('id',id);if(error)alert(error.message);else load()}function toggleDrawer(){$('drawer').classList.toggle('open')}function closeDrawer(){$('drawer').classList.remove('open')}load();</script></body></html>
