<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Bookings | Smart Fitout Admin</title><link rel="stylesheet" href="../admin.css"><style>.wf{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.wf button,.wf a{padding:10px 12px;border:0;border-radius:10px;text-decoration:none;font-weight:800;cursor:pointer}.accept{background:#e9f8ef;color:#087a35}.progress{background:#fff4dc;color:#9a5a00}.complete{background:#e9f0ff;color:#174ea6}.cancel{background:#ffe9e9;color:#a40000}.quote{background:#f3e8ff;color:#6b21a8}.invoice{background:#e8f7f8;color:#075985}.wa{background:#e8f7ed;color:#126b36}.assign{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.assign select{padding:10px;border:1px solid #ddd;border-radius:10px;min-width:190px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#f6f1eb;font-size:12px;font-weight:800}</style></head><body><div class="sf-shell"><header><div><b><span>Smart</span> Fitout</b><small>Service Bookings</small></div><a class="menu-btn" href="dashboard.html">←</a></header><main><div class="dashboard"><p>SMART FITOUT ADMIN</p><h1>Service Bookings</h1><span>Accept, assign, quote, invoice and complete jobs from one screen.</span></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0"><select id="status" style="padding:12px;border:1px solid #ddd;border-radius:10px"><option value="all">All bookings</option><option value="new">New</option><option value="accepted">Accepted</option><option value="in_progress">In Progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><input id="search" placeholder="Search customer, mobile or area" style="padding:12px;border:1px solid #ddd;border-radius:10px;flex:1;min-width:180px"><button onclick="load()" style="padding:12px 16px;border:0;border-radius:10px;background:#f47b20;color:#fff;font-weight:800">↻ Refresh</button></div><div id="error" style="color:#b00020;font-weight:700"></div><div id="list">Loading bookings…</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>let all=[],pros=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=d=>d?new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'';async function loadPros(){const {data}=await sb.from('professionals').select('id,name,phone,trade,experience_years,location,status').order('created_at',{ascending:false});pros=data||[]}async function load(){const er=document.getElementById('error');er.textContent='';document.getElementById('list').textContent='Loading bookings…';await loadPros();const {data,error}=await sb.from('service_requests').select('id,customer_name,customer_email,phone,location,description,preferred_date,preferred_time,status,quoted_amount,quotation_id,invoice_id,created_at,services(name),service_assignments(id,professional_id,professionals(name,phone,trade))').order('created_at',{ascending:false});if(error){er.textContent='Could not load bookings: '+error.message;return}all=data||[];render()}function render(){const st=document.getElementById('status').value,q=document.getElementById('search').value.toLowerCase();const rows=all.filter(b=>(st==='all'||b.status===st)&&(`${b.customer_name} ${b.phone} ${b.location} ${b.services?.name||''}`.toLowerCase().includes(q)));document.getElementById('list').innerHTML=rows.length?rows.map(b=>{const a=b.service_assignments?.[0];const options=pros.map(p=>`<option value="${p.id}" ${a?.professional_id==p.id?'selected':''}>${esc(p.name)} · ${esc(p.trade||'Technician')}</option>`).join('');return `<article style="background:#fff;border:1px solid #ece6df;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #0000000a"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3 style="margin:0">#${b.id} · ${esc(b.services?.name||'Service')}</h3><span class="badge">${esc((b.status||'new').replaceAll('_',' '))}</span></div><p style="line-height:1.8;color:#666"><b>${esc(b.customer_name)}</b> · <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>${b.customer_email?'<br>✉️ '+esc(b.customer_email):''}<br>📍 ${esc(b.location)}<br>📅 ${esc(b.preferred_date||'Any date')} · ${esc(b.preferred_time||'Any time')}<br>🕒 ${fmt(b.created_at)}${b.description?'<br>📝 '+esc(b.description):''}${b.quoted_amount!=null?'<br>💰 Quoted: ₹'+Number(b.quoted_amount).toLocaleString('en-IN'):''}${a?.professionals?'<br>👷 Assigned: <b>'+esc(a.professionals.name)+'</b> · '+esc(a.professionals.phone):''}${b.quotation_id?'<br>🧾 Quotation saved #'+b.quotation_id:''}${b.invoice_id?'<br>📄 Invoice saved #'+b.invoice_id:''}</p><div class="assign">${pros.length?`<select id="tech-${b.id}"><option value="">${a?'Change technician':'Assign technician'}</option>${options}</select><button onclick="assign(${b.id})">Assign</button>`:'<span class="badge">No technicians added yet</span>'}</div><div class="wf"><button class="accept" onclick="setStatus(${b.id},'accepted')">✓ Accept</button><button class="progress" onclick="setStatus(${b.id},'in_progress')">▶ In Progress</button><button class="complete" onclick="setStatus(${b.id},'completed')">✓ Complete</button><button class="cancel" onclick="setStatus(${b.id},'cancelled')">✕ Cancel</button><a class="quote" href="quotation.html?booking=${b.id}">🧾 Quotation</a><a class="invoice" href="invoice.html?booking=${b.id}">📄 Invoice</a><a class="wa" href="https://wa.me/${encodeURIComponent(b.phone.replace(/\D/g,''))}?text=${encodeURIComponent('Hello '+b.customer_name+', this is Smart Fitout regarding booking #'+b.id+'.')}" target="_blank">WhatsApp</a></div></article>`}).join(''):'<p>No bookings found.</p>'}async function setStatus(id,status){let reason='';if(status==='cancelled'){reason=prompt('Cancellation reason for the customer (optional):','Service unavailable / scheduling issue')??''}const {data:updated,error}=await sb.from('service_requests').update({status,cancellation_reason:status==='cancelled'?reason:null,updated_at:new Date().toISOString()}).eq('id',id).select('id,customer_name,customer_email,phone,service_id,description,preferred_date,preferred_time,status,cancellation_reason,services(name)').single();if(error){alert(error.message);return}if(updated?.customer_email){const {error:mailError}=await sb.functions.invoke('notify-booking-update',{body:{status,record:{...updated,service_name:updated.services?.name}}});if(mailError)alert('Booking updated, but customer email could not be sent: '+mailError.message);else alert('Booking updated and email sent to '+updated.customer_email)}else if(status==='cancelled'){alert('Booking cancelled. No customer email is saved for this booking.')}await load()}async function assign(id){const v=document.getElementById('tech-'+id)?.value;if(!v){alert('Select a technician first.');return}const {error:delError}=await sb.from('service_assignments').delete().eq('request_id',id);if(delError){alert(delError.message);return}const {error}=await sb.from('service_assignments').insert({request_id:id,professional_id:Number(v),notes:'Assigned by Smart Fitout admin'});if(error){alert(error.message);return}const {data:b}=await sb.from('service_requests').update({status:'accepted',updated_at:new Date().toISOString()}).eq('id',id).select('id,customer_name,customer_email,phone,location,preferred_date,preferred_time,status,services(name)').single();if(b?.customer_email){const {error:mailError}=await sb.functions.invoke('notify-booking-update',{body:{status:'accepted',record:{...b,service_name:b.services?.name}}});if(mailError)alert('Technician assigned, but email failed: '+mailError.message)}await load()}document.getElementById('status').onchange=render;document.getElementById('search').oninput=render;requireAdmin().then(()=>load());</script></body></html>
