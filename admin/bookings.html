<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Bookings | Smart Fitout Admin</title><link rel="stylesheet" href="../admin.css"></head><body><div class="sf-shell"><header><div><b><span>Smart</span> Fitout</b><small>Service Bookings</small></div><a class="menu-btn" href="dashboard.html">←</a></header><main><div class="dashboard"><p>SMART FITOUT ADMIN</p><h1>Service Bookings</h1><span>Customer requests are shown here automatically.</span></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0"><select id="status" style="padding:12px;border:1px solid #ddd;border-radius:10px"><option value="all">All bookings</option><option value="new">New</option><option value="accepted">Accepted</option><option value="in_progress">In Progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><input id="search" placeholder="Search customer, mobile or area" style="padding:12px;border:1px solid #ddd;border-radius:10px;flex:1;min-width:180px"><button onclick="load()" style="padding:12px 16px;border:0;border-radius:10px;background:#f47b20;color:#fff;font-weight:800">↻ Refresh</button></div><div id="error" style="color:#b00020;font-weight:700"></div><div id="list">Loading bookings…</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=d=>d?new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'';async function load(){const er=document.getElementById('error');er.textContent='';document.getElementById('list').textContent='Loading bookings…';const {data,error}=await sb.from('service_requests').select('id,customer_name,phone,location,description,preferred_date,preferred_time,status,quoted_amount,created_at,services(name)').order('created_at',{ascending:false});if(error){er.textContent='Could not load bookings: '+error.message;return}all=data||[];render()}function render(){const st=document.getElementById('status').value,q=document.getElementById('search').value.toLowerCase();const rows=all.filter(b=>(st==='all'||b.status===st)&&(`${b.customer_name} ${b.phone} ${b.location} ${b.services?.name||''}`.toLowerCase().includes(q)));document.getElementById('list').innerHTML=rows.length?rows.map(b=>`<article style="background:#fff;border:1px solid #ece6df;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #0000000a"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3 style="margin:0">#${b.id} · ${esc(b.services?.name||'Service')}</h3><b>${esc((b.status||'new').replaceAll('_',' '))}</b></div><p style="line-height:1.8;color:#666"><b>${esc(b.customer_name)}</b> · <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a><br>📍 ${esc(b.location)}<br>📅 ${esc(b.preferred_date||'Any date')} · ${esc(b.preferred_time||'Any time')}<br>🕒 ${fmt(b.created_at)}${b.description?'<br>📝 '+esc(b.description):''}${b.quoted_amount!=null?'<br>💰 ₹'+Number(b.quoted_amount).toLocaleString('en-IN'):''}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="setStatus(${b.id},'accepted')">Accept</button><button onclick="setStatus(${b.id},'in_progress')">In Progress</button><button onclick="setStatus(${b.id},'completed')">Complete</button><button onclick="setStatus(${b.id},'cancelled')">Cancel</button><a href="https://wa.me/91${encodeURIComponent(b.phone)}?text=${encodeURIComponent('Hello '+b.customer_name+', this is Smart Fitout regarding booking #'+b.id+'.')}" target="_blank">WhatsApp</a></div></article>`).join(''):'<p>No bookings found.</p>'}async function setStatus(id,status){const {error}=await sb.from('service_requests').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return}await load()}document.getElementById('status').onchange=render;document.getElementById('search').oninput=render;requireAdmin().then(()=>load());</script></body></html>
