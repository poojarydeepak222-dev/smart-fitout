<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Bookings | Smart Fitout Admin</title><link rel="stylesheet" href="../admin.css"><style>.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar select,.toolbar input{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.booking{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #0000000a}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.booking h3{margin:0}.meta{color:var(--muted);font-size:14px;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button,.actions a{border:0;border-radius:9px;padding:10px 12px;text-decoration:none;font-weight:700;cursor:pointer}.primary{background:#f47b20;color:#fff}.dark{background:#151515;color:#fff}.light{background:#eee;color:#111}.empty{padding:25px;text-align:center;background:#fff;border-radius:16px}</style></head><body><div class="sf-shell"><header><div><b><span>Smart</span> Fitout</b><small>Service Bookings</small></div><a class="menu-btn" href="dashboard.html">←</a></header><main><div class="dashboard"><p>SMART FITOUT ADMIN</p><h1>Service Bookings</h1><span>Manage new customer requests from your phone.</span></div><div class="toolbar"><select id="status"><option value="all">All bookings</option><option value="new">New</option><option value="accepted">Accepted</option><option value="assigned">Assigned</option><option value="in_progress">In Progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><input id="search" placeholder="Search name, mobile or area"></div><div id="list">Loading…</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>requireAdmin();let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=d=>d?new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'';async function load(){const {data,error}=await sb.from('service_requests').select('*,services(name)').order('created_at',{ascending:false});if(error){document.getElementById('list').textContent='Could not load bookings: '+error.message;return}all=data||[];render()}function render(){const st=document.getElementById('status').value,q=document.getElementById('search').value.toLowerCase();const rows=all.filter(b=>(st==='all'||b.status===st)&&(`${b.customer_name} ${b.phone} ${b.location} ${b.services?.name||''}`.toLowerCase().includes(q)));document.getElementById('list').innerHTML=rows.length?rows.map(b=>`<article class="booking"><div class="row"><h3>#${b.id} · ${esc(b.services?.name||'Service')}</h3><b>${esc(b.status.replace('_',' '))}</b></div><div class="meta"><b>${esc(b.customer_name)}</b> · <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a><br>📍 ${esc(b.location)}<br>📅 ${esc(b.preferred_date||'Any date')} · ${esc(b.preferred_time||'Any time')}<br>🕒 Received ${fmt(b.created_at)}${b.description?'<br>📝 '+esc(b.description):''}${b.quoted_amount!=null?'<br>💰 Quote: ₹'+Number(b.quoted_amount).toLocaleString('en-IN'):''}</div><div class="actions"><button class="primary" onclick="setStatus(${b.id},'accepted')">Accept</button><button class="light" onclick="setStatus(${b.id},'in_progress')">In Progress</button><button class="dark" onclick="setStatus(${b.id},'completed')">Complete</button><button class="light" onclick="setStatus(${b.id},'cancelled')">Cancel</button><a class="primary" target="_blank" href="https://wa.me/91${encodeURIComponent(b.phone)}?text=${encodeURIComponent('Hello '+b.customer_name+', this is Smart Fitout regarding your '+(b.services?.name||'service')+' booking #'+b.id+'.')}" >WhatsApp</a></div></article>`).join(''):'<div class="empty">No bookings found.</div>'}async function setStatus(id,status){const {error}=await sb.from('service_requests').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return}load()}document.getElementById('status').onchange=render;document.getElementById('search').oninput=render;load();</script></body></html>
