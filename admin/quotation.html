<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Create Quotation | Smart Fitout</title><link rel="stylesheet" href="../admin.css"></head><body><div class="sf-shell"><header><div><b><span>Smart</span> Fitout</b><small>Quotation</small></div><button class="menu-btn" onclick="toggleDrawer()">☰</button></header><aside id="drawer" class="drawer"><button onclick="closeDrawer()">×</button><div style="clear:both"></div><a href="dashboard.html">🏠 Dashboard</a><a href="quotation.html">🧾 Create Quotation</a><a href="invoice.html">📄 Create Invoice</a><a href="products.html">🛠️ Products & Services</a><a href="documents.html">📋 Recent Documents</a><a href="settings.html">⚙️ Settings</a><a href="javascript:logout()">🚪 Logout</a></aside><main class="wrap"><div class="card"><h1>Create Quotation</h1><div class="grid"><label>Quotation No.<input id="docNo"></label><label>Date<input id="docDate" type="date"></label></div></div><div class="card"><h2>Customer Details</h2><label>Name<input id="customerName"></label><label>Mobile<input id="customerMobile" inputmode="tel"></label><label>Address / Site Location<textarea id="customerAddress" rows="2"></textarea></label></div><div class="card"><h2>Items</h2><div id="items"></div><button class="btn secondary" type="button" onclick="addItem()">+ Add Item</button></div><div class="card"><h2>Totals</h2><div class="grid"><label>Discount ₹<input id="discount" type="number" value="0" oninput="calc()"></label><label>GST %<input id="gst" type="number" value="0" oninput="calc()"></label></div><p>Subtotal: <b id="subtotal">₹0.00</b></p><p>GST: <b id="gstAmount">₹0.00</b></p><h2>Grand Total: <b id="grandTotal">₹0.00</b></h2></div><div class="card"><label>Payment Status<select id="paymentStatus"><option>Pending</option><option>Partially Paid</option><option>Paid</option></select></label><label>Notes / Terms<textarea id="notes" rows="4"></textarea></label></div><div class="actions"><button class="btn primary" type="button" onclick="downloadPDF()">📄 Generate & Download PDF</button><button class="btn secondary" type="button" onclick="previewPDF()">Preview PDF</button></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="../admin.js"></script><script>type='quotation';showApp();function toggleDrawer(){document.getElementById('drawer').classList.toggle('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open')}function downloadPDF(){try{const d=payload();if(!d.customer_name||!items.some(x=>x.description)){alert('Enter customer name and at least one item.');return}makePDF(d).save(d.document_number+'.pdf')}catch(e){alert('PDF error: '+e.message)}}</script></body></html>
