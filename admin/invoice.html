<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Create Invoice | Smart Fitout</title><link rel="stylesheet" href="../admin.css"><style>body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#151515}.sf-shell header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#fff;box-shadow:0 2px 12px #0001;position:sticky;top:0;z-index:5}.sf-shell header b{font-size:20px}.sf-shell header b span{color:#f47b20}.sf-shell header small{display:block;color:#777}.menu-btn{font-size:25px;border:0;background:none}.drawer{position:fixed;inset:0 auto 0 0;width:270px;background:#151515;color:#fff;transform:translateX(-105%);transition:.25s;z-index:20;padding:18px}.drawer.open{transform:none}.drawer button{float:right;background:none;border:0;color:#fff;font-size:28px}.drawer a{display:block;color:#fff;text-decoration:none;padding:15px 8px;border-bottom:1px solid #ffffff18}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #0000000d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:600;margin-bottom:12px}input,textarea,select{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}.item{display:grid;grid-template-columns:2fr .7fr .8fr 1fr 40px;gap:8px;align-items:end}.btn{border:0;border-radius:11px;padding:13px 17px;font-weight:700;font-size:15px}.primary{background:#f47b20;color:#fff}.secondary{background:#151515;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:600px){.grid,.item{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:14px}}</style></head><body><div class="sf-shell"><header><div><b><span>Smart</span> Fitout</b><small>Invoice</small></div><button class="menu-btn" onclick="toggleDrawer()">☰</button></header><aside id="drawer" class="drawer"><button onclick="closeDrawer()">×</button><div style="clear:both"></div><a href="dashboard.html">🏠 Dashboard</a><a href="quotation.html">🧾 Create Quotation</a><a href="invoice.html">📄 Create Invoice</a><a href="documents.html">📋 Recent Documents</a><a href="settings.html">⚙️ Settings</a><a href="javascript:logout()">🚪 Logout</a></aside><main class="wrap"><div class="card"><h1>Create Invoice</h1><div class="grid"><label>Invoice No.<input id="docNo"></label><label>Date<input id="docDate" type="date"></label></div></div><div class="card"><h2>Customer Details</h2><label>Name<input id="customerName"></label><label>Mobile<input id="customerMobile" inputmode="tel"></label><label>Address / Site Location<textarea id="customerAddress" rows="2"></textarea></label></div><div class="card"><h2>Items</h2><div id="items"></div><button class="btn secondary" type="button" onclick="addItem()">+ Add Item</button></div><div class="card"><h2>Totals</h2><div class="grid"><label>Discount ₹<input id="discount" type="number" value="0" oninput="calc()"></label><label>GST %<input id="gst" type="number" value="0" oninput="calc()"></label></div><p>Subtotal: <b id="subtotal">₹0.00</b></p><p>GST: <b id="gstAmount">₹0.00</b></p><h2>Grand Total: <b id="grandTotal">₹0.00</b></h2></div><div class="card"><label>Payment Status<select id="paymentStatus"><option>Pending</option><option>Partially Paid</option><option>Paid</option></select></label><label>Notes / Terms<textarea id="notes" rows="4"></textarea></label></div><div class="actions"><button class="btn primary" onclick="saveDocument(event)">Save & Generate PDF</button><button class="btn secondary" onclick="previewPDF()">Preview PDF</button></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="../admin.js"></script><script>type='invoice';showApp();function toggleDrawer(){drawer.classList.toggle('open')}function closeDrawer(){drawer.classList.remove('open')}</script></body></html>
