<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Invoice | Smart Fitout</title><link rel="stylesheet" href="../admin.css"></head><body><div class="sf-shell"><header><div><b><span>Smart</span> Fitout</b><small>Professional Invoice</small></div><button class="menu-btn" onclick="toggleDrawer()">☰</button></header><aside id="drawer" class="drawer"><button onclick="closeDrawer()">×</button><div style="clear:both"></div><a href="dashboard.html">🏠 Dashboard</a><a href="quotation.html">🧾 Create Quotation</a><a href="invoice.html">📄 Create Invoice</a><a href="products.html">🛠️ Products & Services</a><a href="documents.html">📋 Recent Documents</a><a href="javascript:logout()">🚪 Logout</a></aside><main><div class="card"><h1>Smart Fitout Invoice</h1><p>Professional invoice for your customer.</p></div><div class="card"><h2>Invoice Details</h2><div class="grid"><label>Invoice No.<input id="docNo"></label><label>Date<input id="docDate" type="date"></label></div></div><div class="card"><h2>Bill To</h2><div class="grid"><label>Customer Name<input id="customerName" placeholder="Customer name"></label><label>Mobile<input id="customerMobile" inputmode="tel" placeholder="Mobile number"></label></div><label>Address / Site Location<textarea id="customerAddress" rows="2"></textarea></label></div><div class="card"><h2>Items & Services</h2><div id="items"></div><button class="add" type="button" onclick="addItem()">+ Add Item / Service</button></div><div class="card"><div class="grid"><label>Discount ₹<input id="discount" type="number" min="0" value="0" oninput="calc()"></label><label>GST %<input id="gst" type="number" min="0" value="0" oninput="calc()"></label></div><div class="totals"><div><span>Subtotal</span><b id="subtotal">₹0.00</b></div><div><span>Discount</span><b id="discountView">₹0.00</b></div><div><span>GST</span><b id="gstAmount">₹0.00</b></div><div class="grand"><span>Grand Total</span><b id="grandTotal">₹0.00</b></div></div></div><div class="card"><div class="grid"><label>Payment Status<select id="paymentStatus"><option>Pending</option><option>Partially Paid</option><option>Paid</option></select></label><label>Payment Mode<select id="paymentMode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option></select></label></div><label>Notes / Terms<textarea id="notes" rows="4" placeholder="Thank you for choosing Smart Fitout."></textarea></label></div><div class="actions"><button class="primary" type="button" onclick="downloadPDF()">📄 Generate PDF</button><button class="secondary" type="button" onclick="previewPDF()">👁 Preview</button></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="logo-data.js?v=20260831-2"></script><script>window.SMART_FITOUT_LOGO=SMART_FITOUT_LOGO;window.SF_PDF_LOGO_IMAGE=new Image();window.SF_PDF_LOGO_READY=new Promise(function(resolve,reject){var img=window.SF_PDF_LOGO_IMAGE;img.onload=function(){resolve(img)};img.onerror=reject;img.src=SMART_FITOUT_LOGO;});</script><script src="../admin.js?v=20260831-2"></script><script src="pdf-design.js?v=20260831-2"></script><script>type='invoice';showApp();function toggleDrawer(){document.getElementById('drawer').classList.toggle('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open')}async function downloadPDF(){try{await window.SF_PDF_LOGO_READY;const d=payload();if(!d.customer_name||!items.some(x=>x.description)){alert('Enter customer name and at least one item.');return}makePDF(d).save((d.document_number||'invoice')+'.pdf')}catch(e){alert('PDF error: '+e.message)}}async function previewPDF(){try{await window.SF_PDF_LOGO_READY;const d=payload();window.open(URL.createObjectURL(makePDF(d).output('blob')),'_blank')}catch(e){alert('PDF error: '+e.message)}}</script></body></html>
