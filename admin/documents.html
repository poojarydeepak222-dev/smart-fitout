<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recent Documents | Smart Fitout</title><link rel="stylesheet" href="../admin.css"><style>body{margin:0;background:#f5f5f5;font-family:Arial}.head{background:#151515;color:#fff;padding:18px}.head b{font-size:21px}.head span{color:#f47b20}.wrap{max-width:800px;margin:auto;padding:14px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.nav a{padding:11px 13px;background:#fff;border-radius:10px;text-decoration:none;color:#151515}.list{background:#fff;border-radius:15px;padding:8px}.doc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 10px;border-bottom:1px solid #eee}.doc:last-child{border:0}.doc small{color:#777}.doc button{background:#f47b20;color:#fff;border:0;border-radius:9px;padding:10px}</style></head><body><div class="head"><b><span>Smart</span> Fitout</b><br><small>Recent Documents</small></div><main class="wrap"><div class="nav"><a href="dashboard.html">🏠 Dashboard</a><a href="quotation.html">🧾 Quotation</a><a href="invoice.html">📄 Invoice</a><a href="javascript:logout()">🚪 Logout</a></div><div class="list" id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="../admin.js"></script><script>requireAdmin();const a=JSON.parse(localStorage.getItem('sf_docs')||'[]');list.innerHTML=a.length?a.map((d,i)=>`<div class="doc"><div><b>${d.document_number}</b><br><small>${d.doc_type} · ${d.customer_name} · ₹${Number(d.total||0).toLocaleString('en-IN',{minimumFractionDigits:2})}</small></div><button onclick="sharePDF(makePDF(a[${i}]),a[${i}])">Share PDF</button></div>`).join(''):'<p style="padding:15px">No documents saved yet.</p>';</script></body></html>
