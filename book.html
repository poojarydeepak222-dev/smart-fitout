est has been saved successfully. Our Smart Fitout team will contact you shortly.</p><a id="wa" class="wa" target="_blank" rel="noopener">💬 Chat on WhatsApp</a></div></section></main><a class="whatsapp-float" href="https://wa.me/919606963170?text=Hello%20Smart%20Fitout%2C%20I%20want%20to%20book%20a%20maintenance%20service." target="_blank" rel="noopener" aria-label="WhatsApp">☘</a><script>const SB_URL='https://bjxbqhcgdwmluwjfawse.supabase.co',SB_KEY='sb_publishable_Pba7tiTGZFh3lo-AcVitlA_6E-WA5ZJ',db=supabase.createClient(SB_URL,SB_KEY),sel=document.getElementById('service'),err=document.getElementById('error');async function init(){try{const {data,error}=await db.from('services').select('id,name').eq('active',true).order('id');if(error)throw error;sel.innerHTML='<option value="">Choose a service</option>'+(data||[]).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');const requested=new URLSearchParams(location.search).get('service');const match=(data||[]).find(s=>s.name.toLowerCase()===String(requested||'').toLowerCase());if(match)sel.value=match.id;document.getElementById('date').min=new Date().toISOString().slice(0,10)}catch(e){console.error(e);sel.innerHTML='<option value="">Select a service</option>';err.textContent='Services could not be loaded. Please call +91 96069 63170.'}}init();document.getElementById('booking').addEventListener('submit',async e=>{e.preventDefault();err.textContent='';const btn=document.getElementById('submitBtn'),mobile=document.getElementById('mobile').value.trim(),email=document.getElementById('email').value.trim().toLowerCase();if(!/^[0-9]{10}$/.test(mobile)){err.textContent='Please enter a valid 10-digit mobile number.';return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Please enter a valid email address.';return}if(!sel.value){err.textContent='Please choose a service.';return}const payload={customer_name:document.getElementById('name').value.trim(),phone:mobile,customer_email:email,service_id:Number(sel
