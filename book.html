<!doctype html><html lang="en-IN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Book a Service | Smart Fitout Udupi</title><link rel="stylesheet" href="styles.css?v=20260831a"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><a class="brand" href="/">Smart <b>Fitout</b></a><a class="header-phone" href="tel:+919606963170">📞 +91 9606963170</a></header><main><section class="section" style="max-width:700px;margin:auto"><p class="eyebrow">SMART FITOUT • UDUPI</p><h1>Book a Service</h1><p>Tell us what you need. Your request will be saved securely and our team will contact you.</p><form id="booking" class="contact" style="text-align:left"><label>Service *<select id="service" required><option value="">Loading services…</option></select></label><label>Name *<input id="name" required maxlength="120" autocomplete="name" placeholder="Your name"></label><label>Mobile *<input id="mobile" required maxlength="10" inputmode="numeric" pattern="[0-9]{10}" autocomplete="tel" placeholder="10-digit mobile number"></label><label>Area / Location *<input id="area" required maxlength="180" placeholder="Example: Manipal, Udupi"></label><label>Preferred date<input id="date" type="date"></label><label>Preferred time<select id="time"><option value="">Any time</option><option>Morning (9 AM–12 PM)</option><option>Afternoon (12 PM–4 PM)</option><option>Evening (4 PM–8 PM)</option></select></label><label>Work details<textarea id="details" maxlength="1000" placeholder="Describe the work you need..."></textarea></label><p id="error" style="color:#b00020"></p><button class="btn primary" type="submit">📲 Submit Booking</button></form><div id="success" hidden class="contact"><h2>Booking received! ✅</h2><p>Your Smart Fitout booking has been saved. Our team will contact you shortly.</p><a id="wa" class="btn primary" target="_blank" rel="noopener">Chat on WhatsApp</a></div></section></main><a class="whatsapp-float" href="https://wa.me/919606963170?text=Hello%20Smart%20Fitout%2C%20I%20want%20to%20book%20a%20maintenance%20service." target="_blank" rel="noopener">☘ <b>WhatsApp</b></a><script>const URL='https://bjxbqhcgdwmluwjfawse.supabase.co',KEY='sb_publishable_Pba7tiTGZFh3lo-AcVitlA_6E-WA5ZJ',db=supabase.createClient(URL,KEY),sel=document.getElementById('service');async function init(){const {data,error}=await db.from('services').select('id,name').eq('active',true).order('id');if(error){document.getElementById('error').textContent='Services could not be loaded. Please call +91 9606963170.';return}sel.innerHTML='<option value="">Choose a service</option>'+data.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');const requested=new URLSearchParams(location.search).get('service');const match=data.find(s=>s.name.toLowerCase()===String(requested||'').toLowerCase());if(match)sel.value=match.id;const d=document.getElementById('date');d.min=new Date().toISOString().slice(0,10)}init();document.getElementById('booking').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('error');err.textContent='';const mobile=document.getElementById('mobile').value.trim();if(!/^[0-9]{10}$/.test(mobile)){err.textContent='Enter a valid 10-digit mobile number.';return}const payload={customer_name:document.getElementById('name').value.trim(),phone:mobile,service_id:Number(sel.value),location:document.getElementById('area').value.trim(),description:document.getElementById('details').value.trim()||null,preferred_date:document.getElementById('date').value||null,preferred_time:document.getElementById('time').value||null,status:'new'};if(!payload.customer_name||!payload.service_id||!payload.location){err.textContent='Please complete all required fields.';return}const {error}=await db.from('service_requests').insert(payload);if(error){console.error(error);err.textContent='Booking failed. Please try again or call us.';return}const serviceName=sel.options[sel.selectedIndex].text;const msg=`Hello Smart Fitout, I submitted a booking.%0A%0AService: ${encodeURIComponent(serviceName)}%0AName: ${encodeURIComponent(payload.customer_name)}%0AMobile: ${encodeURIComponent(payload.phone)}%0AArea: ${encodeURIComponent(payload.location)}%0APreferred date: ${encodeURIComponent(payload.preferred_date||'Any date')}%0APreferred time: ${encodeURIComponent(payload.preferred_time||'Any time')}%0ADetails: ${encodeURIComponent(payload.description||'Not provided')}`;document.getElementById('wa').href='https://wa.me/919606963170?text='+msg;document.getElementById('booking').hidden=true;document.getElementById('success').hidden=false;});</script></body></html>
