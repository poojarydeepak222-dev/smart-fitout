<!doctype html><html lang="en-IN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Book a Service | Smart Fitout Udupi</title><meta name="description" content="Book Smart Fitout home and office maintenance services in Udupi. Select a service, enter your name, mobile number and area, then send your booking directly to WhatsApp."><link rel="canonical" href="https://smartfitout.in/book.html"><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:#171717}.wrap{max-width:620px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}.brand{font-size:25px;font-weight:800}.brand b{color:#f47b20}.sub{color:#666}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:7px}input,select,textarea{box-sizing:border-box;width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px}textarea{min-height:90px;resize:vertical}.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;background:#f47b20;color:#fff}.back{display:inline-block;margin-bottom:20px;color:#222;text-decoration:none;font-weight:700}.note{font-size:13px;color:#777;margin-top:14px;text-align:center}.error{color:#c00;font-size:14px;margin-top:8px}</style></head><body><div class="wrap"><a class="back" href="https://smartfitout.in/">← Smart Fitout</a><div class="card"><div class="brand">Smart <b>Fitout</b></div><p class="sub">Complete your booking for home & office maintenance service in Udupi.</p><form id="booking"><div class="field"><label for="service">Selected service *</label><select id="service" required><option value="">Choose a service</option><option>Electrical</option><option>Plumbing</option><option>Painting</option><option>Carpenter</option><option>Cleaning</option><option>Water Tank Cleaning</option><option>Pest Control</option><option>Home Maintenance</option><option>Office Maintenance</option></select></div><div class="field"><label for="name">Your name *</label><input id="name" type="text" autocomplete="name" required placeholder="Enter your name"></div><div class="field"><label for="mobile">Mobile number *</label><input id="mobile" type="tel" inputmode="numeric" autocomplete="tel" required pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number"></div><div class="field"><label for="area">Area / Location in Udupi *</label><input id="area" type="text" autocomplete="address-level2" required placeholder="Example: Manipal, Santhekatte"></div><div class="field"><label for="details">Service details</label><textarea id="details" placeholder="Tell us what work you need..."></textarea></div><div id="error" class="error" role="alert"></div><button class="btn" type="submit">💬 Book & Send to WhatsApp</button></form><p class="note">After you submit, WhatsApp opens with your booking details addressed to Smart Fitout: +91 9606963170.</p></div></div><script>const params=new URLSearchParams(window.location.search);const requestedService=params.get('service');const serviceSelect=document.getElementById('service');if(requestedService){const option=[...serviceSelect.options].find(o=>o.value.toLowerCase()===requestedService.trim().toLowerCase());if(option){serviceSelect.value=option.value;}}document.getElementById('booking').addEventListener('submit',function(e){e.preventDefault();const service=serviceSelect.value.trim(),name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim(),area=document.getElementById('area').value.trim(),details=document.getElementById('details').value.trim(),err=document.getElementById('error');if(!service||!name||!/^[0-9]{10}$/.test(mobile)||!area){err.textContent='Please enter all required details and a valid 10-digit mobile number.';return}err.textContent='';const msg=`New Smart Fitout Booking%0A%0AService: ${encodeURIComponent(service)}%0AName: ${encodeURIComponent(name)}%0AMobile: ${encodeURIComponent(mobile)}%0AArea: ${encodeURIComponent(area)}%0AService details: ${encodeURIComponent(details||'Not provided')}`;window.location.href='https://wa.me/919606963170?text='+msg;});</script></body></html>
