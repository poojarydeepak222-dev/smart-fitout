<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Smart Fitout Admin</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<div id="login" class="login"><div class="login-card"><div class="logo">SF</div><h1>Smart Fitout</h1><p>Admin Panel</p><input id="email" type="email" value="info@smartfitout.in" placeholder="Admin email" autocomplete="username"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button onclick="login()">Login</button><small id="loginError"></small></div></div>
<div id="app" hidden><header><div><b><span>Smart</span> Fitout</b><small>Admin Panel</small></div><button class="logout" onclick="logout()">Logout</button></header><main>
<section class="dashboard"><div><p>DOCUMENT MANAGEMENT</p><h1>Create Quotation / Invoice</h1><span>Professional PDF documents for your customers.</span></div><div class="stats"><strong id="docCount">0</strong><small>Documents</small></div></section>
<form id="docForm" onsubmit="return saveDocument(event)"><div class="card"><h2>Document</h2><div class="tabs"><button type="button" class="active" id="qtab" onclick="setType('quotation')">Quotation</button><button type="button" id="itab" onclick="setType('invoice')">Invoice</button></div><input type="hidden" id="docType" value="quotation"><div class="grid"><label>Document No.<input id="docNo" required></label><label>Date<input id="docDate" type="date" required></label></div></div>
<div class="card"><h2>Customer Details</h2><div class="grid"><label>Customer Name<input id="customerName" required></label><label>Mobile Number<input id="customerMobile" inputmode="tel"></label></div><label>Address / Site Location<textarea id="customerAddress" rows="2"></textarea></label></div>
<div class="card"><h2>Work / Items</h2><div id="items"></div><button type="button" class="add" onclick="addItem()">+ Add Item</button></div>
<div class="card"><h2>Totals</h2><div class="grid"><label>Discount (₹)<input id="discount" type="number" min="0" step="0.01" value="0" oninput="calc()"></label><label>GST %<input id="gst" type="number" min="0" step="0.01" value="0" oninput="calc()"></label></div><div class="totals"><div>Subtotal <b id="subtotal">₹0.00</b></div><div>GST <b id="gstAmount">₹0.00</b></div><div class="grand">Grand Total <b id="grandTotal">₹0.00</b></div></div></div>
<div class="card"><h2>Payment & Notes</h2><label>Payment Status<select id="paymentStatus"><option>Pending</option><option>Partially Paid</option><option>Paid</option></select></label><label>Notes / Terms<textarea id="notes" rows="4" placeholder="Thank you for choosing Smart Fitout."></textarea></label></div>
<div class="actions"><button class="primary" type="submit">Save & Generate PDF</button><button class="secondary" type="button" onclick="previewPDF()">Preview PDF</button></div></form>
<section class="card history"><h2>Recent Documents</h2><div id="history"></div></section>
</main></div><script src="admin.js"></script></body></html>
