<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>Smart Fitout Admin Login</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<div id="login" class="login"><div class="login-card"><div class="logo">SF</div><h1>Smart Fitout</h1><p>Admin Login</p><input id="email" type="email" value="info@smartfitout.in" placeholder="Admin email" autocomplete="username"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button onclick="login()">Login</button><small id="loginError"></small></div></div>
<div id="app" hidden></div>
<script src="admin.js"></script>
<script>
async function login(){const email=document.getElementById('email').value.trim().toLowerCase();const password=document.getElementById('password').value;if(email!=='info@smartfitout.in'){document.getElementById('loginError').textContent='Use the Smart Fitout admin email.';return}if(!password){document.getElementById('loginError').textContent='Enter your password.';return}document.getElementById('loginError').textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email,password});if(error){document.getElementById('loginError').textContent=error.message;return}location.replace('admin/dashboard.html')}
sb.auth.getSession().then(({data:{session}})=>{if(session&&session.user.email.toLowerCase()==='info@smartfitout.in')location.replace('admin/dashboard.html')});
</script></body></html>
